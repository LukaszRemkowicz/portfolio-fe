name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-main:
    uses: LukaszRemkowicz/ci-cd/.github/workflows/release-tag.yml@main
    with:
      version_file: package.json
      tag_prefix: v

  # Same flow as cosmic-journey: a new version on main is tagged, then deployed.
  # Worker vars and secrets live in Cloudflare (set once per worker), so the
  # job only builds and uploads code. The production worker has no routes
  # until the domain cutover, so deploying does not change the live site.
  deploy-production:
    name: Deploy Worker (production)
    needs: tag-main
    if: needs.tag-main.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build (production env)
        env:
          CLOUDFLARE_ENV: production
          ENVIRONMENT: production
          # Build-time only: PWA manifest name.
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
        run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ needs.tag-main.outputs.release_tag }}
        run: npx wrangler deploy --message "$RELEASE_TAG"
