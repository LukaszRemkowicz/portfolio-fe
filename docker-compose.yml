# Local development only. Runs the dev server inside the backend repo's dev
# network under the hostname `fe`, which is what its local nginx proxies to, so
# https://portfolio.local and https://admin.portfolio.local work unchanged.
#
#   1. backend repo:  docker compose up -d be        (creates the network)
#   2. this repo:     docker compose up -d fe
#   3. backend repo:  docker compose up -d nginx
name: portfolio-fe-dev

services:
  fe:
    build:
      context: docker
      dockerfile: Dockerfile.dev
    # Reinstall only when package-lock.json changed since the last install.
    command:
      - sh
      - -c
      - >-
        { [ -f node_modules/.ci-stamp ] && [ ! package-lock.json -nt node_modules/.ci-stamp ]; }
        || { npm ci --no-audit --no-fund && touch node_modules/.ci-stamp; }
        && exec npm run dev
    environment:
      ENVIRONMENT: development
      PROJECT_OWNER: Lukasz Remkowicz
      VITE_CACHE_DIR: node_modules/vite-cache
    volumes:
      - ./:/app
      - ./docker/dev.vars:/app/.dev.vars:ro
      # Linux binaries (workerd, esbuild) must not mix with the host's node_modules.
      - node_modules:/app/node_modules
    networks:
      backend:
        aliases: [fe]
    restart: unless-stopped

volumes:
  node_modules:

networks:
  backend:
    name: portfolio-dev_portfolio_network
    external: true
