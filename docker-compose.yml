# Local development only. Runs the dev server in Docker; it reaches the local
# Edge Function API (:8001) and Django media (:8000) on the host (see
# docker/dev.vars). Start the API with the backend repo's
# infra/scripts/run_local_api.sh, then:  docker compose up -d fe
# The site is on http://localhost:8080.

name: portfolio-fe-dev

services:
  fe:
    build:
      context: docker
      dockerfile: Dockerfile.dev
    # Reinstall only when package-lock.json changed since the last install.
    command:
      - sh
      - -c
      - >-
        { [ -f node_modules/.ci-stamp ] && [ ! package-lock.json -nt node_modules/.ci-stamp ]; }
        || { npm ci --no-audit --no-fund && touch node_modules/.ci-stamp; }
        && exec npm run dev
    environment:
      ENVIRONMENT: development
      PROJECT_OWNER: Lukasz Remkowicz
      VITE_CACHE_DIR: node_modules/vite-cache
    volumes:
      - ./:/app
      - ./docker/dev.vars:/app/.dev.vars:ro
      # Linux binaries (workerd, esbuild) must not mix with the host's node_modules.
      - node_modules:/app/node_modules
    ports:
      - '8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  node_modules:
